<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <div>
        <h1>Testing and So On</h1>
        <hr>
        <button id="knightButton">Knight</button>
        <button id="slimeButton">Create Slime</button>
    </div>
    <div id="heroContainer">
        <div id="heroStats">
            <h2>Stats</h2>
            <span id="health"></span>
            <span id="ap"></span>
            <span id="defense"></span>
            <span id="speed"></span>
        </div>
        <div id="heroAbilities">
            <h2>Abilities</h2>
        </div>
    </div>
    <div id="enemyContainer">
        <div id="enemyStats">
            <h2>Stats</h2>
            <span id="enemyName"></span>
            <span id="enemyAttribute"></span>
            <span id="enemyHealth"></span>
            <span id="enemyDefense"></span>
            <span id="enemySpeed"></span>
        </div>
        <div id="enemyAbilities">
            <h2>Abilities</h2>
            <p><span id="enemyAbility1"></span></p>
            <p><span id="enemyAbility2"></span></p>
            <p><span id="enemyAbility3"></span></p>
            <p><span id="enemyAbility4"></span></p>
        </div>
    </div>
            
</body>

<script src="assets/scripts/index.js" type="module"></script>

</html>
