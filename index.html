<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser RPG</title>
    <link rel="stylesheet" href="assets/styles/index.css">
</head>

<body>
    <div class="container">
        <div class="setupContainer">
            <h1>Browser RPG</h1>
            <hr>
            <div>
                <h2>Add Hero</h2>
                <button id="addBrawlerButton">Add Brawler</button>
                <button id="addKnightButton">Add Knight</button>
            </div>
            <div>
                <h2>Game Start</h2>
                <button id="startGameButton">Start Game</button>
            </div>
        </div>
        <div id="activeQueue" class="turnQueue">
            <!-- Turn queue will be displayed here -->
        </div>
        <div class="heroParty">
            <h2>Hero Party</h2>
            <div id="simpleHeroDisplay">

            </div>
        </div>
        <div>
            <!-- <h2>Hero</h2>
            <!-- Highly consider setting up html code that holds heroes since the hero party will never change -->
            <div id="currentHero">

            </div>
            <div id="heroAbilities" class="heroAbilities">

            </div>
        </div>
        <div class="enemyParty">
            <h2>Enemy Party</h2>
            <div id="enemyParty">
            </div>
        </div>

</body>

<script src="assets/scripts/index.js" type="module"></script>

</html>
